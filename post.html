
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Lütfü Koca</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="/" class="logo">LK.</a>
            <ul class="nav-links">
                <li><a href="/">Ana Sayfa</a></li>
                <li><a href="/blog/">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-section">
        <p class="welcome">{{ page.categories | join: " / " }}</p>

        <h1>{{ page.title }}</h1>

        <p>{{ page.date | date: "%d.%m.%Y" }}</p>

        <article class="post-content">
            {{ content }}
        </article>

        <a href="/blog/" class="privacy-button">
            Bloga Geri Dön
        </a>
    </main>

    <footer>
        <p>© 2026 Lütfü Koca</p>
    </footer>

</body>
</html>
